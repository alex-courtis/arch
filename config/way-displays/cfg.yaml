# $schema: https://raw.githubusercontent.com/alex-courtis/way-displays/refs/heads/master/schema/cfg-2.0.0.yaml
# man 5 way-displays
ARRANGE: ROW
ALIGN: BOTTOM
ORDER:
- XG349C
- M28U
- eDP-1
- M32Q
SCALING: TRUE
SCALE_ROUND_TO: 0.25
SCALE_ROUND_STRATEGY: UP
AUTO_SCALE: TRUE
AUTO_SCALE_DPI: 96
AUTO_SCALE_MIN: 1
AUTO_SCALE_MAX: -1
SCALE:
  LG Display 0x05EF: 2
  BOE 0x0BCA: 2
MODE:
  M28U:
    MAX: TRUE
TRANSFORM:
VRR_OFF:
- LG Display 0x05EF
- BOE 0x0BCA
CALLBACK_CMD: notify-send "way-displays ${CALLBACK_LEVEL}" "${CALLBACK_MSG}"
LAPTOP_LID_MONITOR: TRUE
DISABLED:
  '!^eDP-[0-9]':
    IF:
    - LID: CLOSED
    - PLUGGED:
      - '!^DP-[1-9]+$'
